<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Systemix | لوحة التحكم</title>
<link rel="icon" href="/logo.webp">
<style>
:root{--bg:#07040d;--card:#120a1f;--card2:#0c0716;--line:#2a1646;--p:#8b2fe8;--p2:#b46bff;--tx:#f1e9ff;--mu:#a592c4;--ok:#2ecc71;--bad:#ff4d6d}
*{box-sizing:border-box;margin:0;font-family:Tahoma,"Segoe UI",sans-serif}
body{background:radial-gradient(900px 500px at 85% -10%,#3b0f73aa,transparent),radial-gradient(700px 500px at 0% 110%,#5a14a855,transparent),var(--bg);color:var(--tx);min-height:100vh}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:var(--p);color:#fff;font-size:13px}
button:hover{background:var(--p2)}button.g{background:#1e1233;border:1px solid var(--line)}button.d{background:var(--bad)}button.s{padding:6px 10px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px;font-size:13px}
textarea{min-height:80px;resize:vertical}input[type=color]{height:40px;padding:3px}input[type=checkbox]{width:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:250px;background:#0c0716f2;border-left:1px solid var(--line);padding:16px 12px;overflow-y:auto;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:12px}.brand img{width:40px;border-radius:50%}
.srvcard{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.srvcard b{display:block;color:var(--p2);font-size:14px}.srvcard a{color:var(--mu);font-size:12px;text-decoration:none}
.gt{color:var(--mu);font-size:11px;margin:14px 8px 4px;font-weight:700}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;color:var(--tx);padding:9px 10px;border-radius:10px;font-size:14px}
.nv:hover,.nv.on{background:#2a1646}.nv.on{border:1px solid var(--p)}.nv i{font-style:normal;width:22px;text-align:center}.nv span{flex:1}.nv em{font-style:normal;color:#fff;background:var(--ok);border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center}
.out{margin-top:16px;width:100%}
main{margin-right:250px;padding:22px;max-width:1150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}.top h2{font-size:22px}
.pd{color:var(--mu);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:8px}.ch h3{font-size:16px}
.mu,small{color:var(--mu);font-size:12px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}.grid .card{margin:0}.n{font-size:26px;font-weight:700;color:var(--p2);margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.rl b{display:block;font-size:14px;font-weight:600}.rl small{display:block}.rc{display:flex;align-items:center;gap:8px}
.fld{margin:12px 0}.fld>label{display:block;font-size:13px;color:var(--tx);margin-bottom:4px}.fld>small{display:block;margin-bottom:6px}
.sw{position:relative;width:46px;height:26px;flex:none;display:inline-block}.sw input{display:none}
.sw span{position:absolute;inset:0;background:#33224f;border-radius:20px;transition:.2s;cursor:pointer}
.sw span:after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--p)}.sw input:checked+span:after{right:23px}
.pcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:22px;border-radius:20px;margin-bottom:14px;background:linear-gradient(135deg,#2b0a3d,#12061f);border:1px solid #5a2a8f}
.pcard.on{background:linear-gradient(135deg,#4a0a1a,#1f0510);border-color:var(--bad)}.pcard .t{flex:1;min-width:200px}
.ring{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:#1e1233;border:2px solid var(--p);box-shadow:0 0 24px #8b2fe866}
.pcard.on .ring{border-color:var(--bad);animation:pl 1.4s infinite}@keyframes pl{0%,100%{box-shadow:0 0 18px #ff4d6d66}50%{box-shadow:0 0 50px #ff4d6dcc}}
.pbtn{padding:14px 26px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#ff2d55,#b0123a)}.pcard.on .pbtn{background:linear-gradient(135deg,#2ecc71,#118a4a)}
.tag{display:inline-flex;gap:8px;align-items:center;background:#241338;border:1px solid var(--line);padding:5px 10px;border-radius:20px;margin:3px;font-size:13px}.tag b{cursor:pointer;color:var(--bad)}
.ip{display:flex;gap:8px;margin-top:8px}.wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.item:last-child{border:0}.item small{display:block}
.pv{background:var(--card2);border-right:4px solid var(--p);border-radius:8px;padding:12px;margin-top:10px;white-space:pre-wrap;font-size:13px}
.ban{border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:14px}
.lgrow{display:grid;grid-template-columns:46px 1fr minmax(120px,200px) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cnt{color:var(--mu);font-size:12px;margin-inline-start:8px}
#toast{position:fixed;bottom:20px;left:20px;background:var(--p);padding:12px 18px;border-radius:12px;display:none;z-index:50}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:40;padding:16px}#modal .card{max-width:520px;width:100%;margin:0}
.bar{display:none;position:sticky;top:0;z-index:6;background:#0c0716;border-bottom:1px solid var(--line);padding:8px}
@media(max-width:860px){aside{position:static;width:auto;border:0;border-bottom:1px solid var(--line)}main{margin:0;padding:12px}.lgrow{grid-template-columns:46px 1fr}}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="/logo.webp" alt=""><span>Systemix</span></div>
  <div class="srvcard"><img src="/logo.webp" width="38" style="border-radius:50%" alt=""><div><b id="gname">…</b><a href="/servers">تغيير السيرفر ↩</a></div></div>
  <a id="ownLink" href="/owner" style="display:none"><button class="g" style="width:100%;margin-top:6px">👑 لوحة المالك</button></a>
  <nav id="nav"></nav>
  <a href="/logout"><button class="g out">تسجيل الخروج</button></a>
</aside>
<main>
  <div class="top"><h2 id="title"></h2><div id="master" class="rc"></div></div>
  <div class="pd" id="pdesc"></div>
  <div id="banner"></div>
  <div id="view"></div>
</main>
<div id="toast"></div>
<div id="modal"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => { const k = p.split('.'), l = k.pop(); k.forEach((x) => (o = o[x] ??= {})); o[l] = v; };
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2500); };
async function api(path, body, method) {
  try {
    const r = await fetch(path, { method: method || (body ? 'POST' : 'GET'), credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    return await r.json();
  } catch { toast('تعذر الاتصال بالسيرفر'); return null; }
}
const fmtD = (t) => new Date(t).toLocaleString('ar-SA');
const ok = (r, m = '✅ تم') => toast(r && r.ok ? m : (r && r.msg) || '❌ فشل');

/* ============ defaults / state ============ */
const DEF = {
  on: true, logCh: '', evCh: '', limit: 3, window: 10, punish: 'ban', altDays: 3, panicScore: 12, raidJoins: 8, raidMin: 5, raidAct: 'kick', maxMentions: 5, autoBackup: 0,
  spamMsgs: 6, spamSec: 5, muteMin: 60, warnMax: 3, warnAct: 'timeout', capsOn: false, capsPct: 70, blockInvites: false, allowInv: '', badWords: '', wordAction: 'timeout', badDomains: '',
  autoPanic: false, dmPunish: false, honeypot: '', autorole: '', botrole: '', ar: [], stats: [], lg: {},
  sec: { nuke: 1, ban: 1, chan: 1, role: 1, hook: 1, vanity: 1, esc: 1, alt: 1, emoji: 1, gset: 1, integ: 1, bots: 1, raid: 1, honey: 1, trust: 1, restore: 1, spam: 1, words: 1, link: 1, mention: 1 },
  welcome: { on: true, ch: '', title: '', color: '#2ecc71', msg: 'حياك الله {user} في {server} 👋\nأنت العضو رقم {count}', dm: false, dmMsg: '' },
  leave: { on: false, ch: '', msg: '{user} غادر السيرفر 😢' },
  lvl: { on: true, announce: true, ch: '', msg: '🎉 مبروك {user} وصلت لفل **{level}**', min: 15, max: 25, cd: 60, ignore: [], rewards: [] },
  tk: { ch: '', cat: '', role: '' }, verify: { ch: '', role: '' },
  star: { on: false, ch: '', n: 3, emoji: '⭐', self: false }, tv: { on: false, ch: '', cat: '', name: '🔊 {user}', limit: 0 },
};
let S = JSON.parse(JSON.stringify(DEF)), ST = {}, cur = 'home', saveT;
const merge = (d, s) => { for (const k in s) d[k] = d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && s[k] && typeof s[k] === 'object' ? merge(d[k], s[k]) : s[k]; return d; };

async function save(msg = '✅ حُفظ وطُبّق على البوت') {
  const r = await api('/api/config', S, 'PUT');
  if (r && r.ok) toast(msg);
  else if (r && r.error === 'login') { toast('⚠️ انتهت الجلسة، سجّل الدخول من جديد'); setTimeout(() => (location.href = '/'), 1500); }
  else if (r && r.error === 'sub') toast('⛔ اشتراك البوت متوقف في هذا السيرفر — تواصل مع المالك');
  else toast('❌ لم يُحفظ — تأكد أن البوت شغّال');
}
const autosave = () => { clearTimeout(saveT); saveT = setTimeout(() => save('✅ حُفظ تلقائياً وطُبّق'), 600); };
async function refresh() { const st = await api('/api/state'); if (st && !st.error) { ST = st; } return st; }

/* ============ UI builders ============ */
const sw = (p, d = true) => `<label class="sw"><input type="checkbox" data-p="${p}" ${(get(S, p) ?? d) ? 'checked' : ''}><span></span></label>`;
const row = (ic, l, d, ctl) => `<div class="row"><div class="rl"><b>${ic ? ic + ' ' : ''}${l}</b>${d ? `<small>${d}</small>` : ''}</div><div class="rc">${ctl}</div></div>`;
const tog = (p, ic, l, d, def = true) => row(ic, l, d, sw(p, def));
const fld = (l, d, inner) => `<div class="fld"><label>${l}</label>${d ? `<small>${d}</small>` : ''}${inner}</div>`;
const inp = (p, l, d, ph = '', type = 'text') => fld(l, d, `<input type="${type}" data-v="${p}" value="${esc(get(S, p) ?? '')}" placeholder="${esc(ph)}">`);
const num = (p, l, d, min, max, def) => fld(l, d, `<input type="number" min="${min}" max="${max}" data-n="${p}" value="${get(S, p) ?? def}">`);
const area = (p, l, d, ph = '') => fld(l, d, `<textarea data-v="${p}" placeholder="${esc(ph)}">${esc(get(S, p) ?? '')}</textarea>`);
const sel = (p, l, d, opts) => fld(l, d, `<select data-v="${p}">${opts.map(([v, n]) => `<option value="${v}" ${String(get(S, p)) === String(v) ? 'selected' : ''}>${n}</option>`).join('')}</select>`);
const opts = (list, val, ph) => `<option value="">${ph}</option>` + list.map((x) => `<option value="${x.id}" ${x.id === val ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
const pick = (p, l, d, list, ph = '— بدون —') => fld(l, d, `<select data-v="${p}">${opts(list, get(S, p), ph)}</select>`);
const card = (ic, t, d, body, head = '') => `<section class="card"><div class="ch"><h3>${ic} ${t}</h3>${head}</div>${d ? `<p class="mu" style="margin-bottom:6px">${d}</p>` : ''}${body}</section>`;
const btn = (act, label, cls = '', extra = '') => `<button class="${cls}" data-act="${act}" ${extra}>${label}</button>`;
const SAVE = `<div class="wrap">${btn('save', 'حفظ')}<small style="align-self:center">الحفظ يتم تلقائياً أيضاً</small></div>`;
const chText = () => ST.channels || [], chVoice = () => ST.voices || [], roles = () => ST.roles || [], cats = () => ST.categories || [];
const chOpts = () => (ST.channels || []).map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

/* ============ navigation ============ */
const NAV = [
  ['عام', [['home', '📊', 'نظرة عامة'], ['srv', '⚙️', 'إعدادات السيرفر'], ['emb', '🧩', 'رسائل الإيمبد']]],
  ['الأنظمة', [['wel', '👋', 'الترحيب والوداع'], ['ar', '💬', 'الردود التلقائية'], ['lvl', '🏆', 'نظام المستويات'], ['arole', '🎖️', 'الرتب التلقائية'], ['srole', '😀', 'رتب ذاتية'],
    ['star', '⭐', 'لوحة النجوم'], ['tv', '➕', 'رومات مؤقتة'], ['stats', '📈', 'الإحصائيات'], ['tk', '🎫', 'التذاكر']]],
  ['الإدارة والحماية', [['mod', '🔨', 'الإدارة'], ['logs', '📜', 'اللوقات'], ['auto', '🛡️', 'الحماية التلقائية'], ['raid', '🚨', 'مكافحة الهجمات'], ['bk', '💾', 'النسخ الاحتياطي'], ['bin', '♻️', 'سلة الاستعادة']]],
  ['أخرى', [['top', '🥇', 'لوحة المتصدرين'], ['acts', '🗂️', 'سجل الإجراءات'], ['dlog', '🧾', 'سجل لوحة التحكم'], ['bot', '🤖', 'إعدادات البوت']]],
];
const PD = {
  home: 'نظرة سريعة على سيرفرك والبوت، مع زر الطوارئ.', srv: 'الإعدادات العامة للبوت داخل هذا السيرفر.', emb: 'أرسل رسالة إمبد منسّقة لأي قناة.',
  wel: 'رسائل الترحيب بالأعضاء الجدد والوداع عند المغادرة.', ar: 'ردود يرسلها البوت تلقائياً عند كلمات معينة.', lvl: 'نقاط وفلات للأعضاء المتفاعلين مع رتب مكافآت.',
  arole: 'رتب يعطيها البوت تلقائياً لكل داخل جديد.', srole: 'لوحة أزرار يأخذ منها الأعضاء رتبهم بأنفسهم.', star: 'الرسائل اللي تجمع نجوم كثيرة تُنشر في قناة مخصصة.',
  tv: 'روم صوتي يُنشئ لكل عضو روماً خاصاً ويحذفه لما يفضى.', stats: 'رومات صوتية تعرض أرقام السيرفر وتتحدث تلقائياً.', tk: 'نظام الدعم الفني بالتذاكر.',
  mod: 'إجراءات إدارية سريعة على الأعضاء والرومات.', logs: 'اختر الأحداث اللي يسجلها البوت، وقناة كل حدث، وشكل الرسالة.',
  auto: 'فلاتر تلقائية للمحتوى: سبام، كلمات، روابط، منشن، دعوات.', raid: 'حمايات التخريب والغارات وقناة الفخ وبوابة التحقق والقائمة البيضاء.',
  bk: 'احفظ نسخة من الرتب والرومات واستعدها وقت الحاجة.', bin: 'الرومات والرتب المحذوفة مؤخراً، تقدر ترجعها بضغطة.', top: 'أعلى الأعضاء نقاطاً في السيرفر.',
  acts: 'سجل الإجراءات اللي نفذها البوت أو الإدارة على الأعضاء.', dlog: 'من غيّر ماذا في لوحة التحكم ومتى.', bot: 'حالة البوت، تصدير واستيراد الإعدادات.',
};
const ENABLED = {
  wel: () => S.welcome.on || S.leave.on, ar: () => S.ar.length > 0, lvl: () => S.lvl.on !== false, arole: () => !!(S.autorole || S.botrole), star: () => S.star.on, tv: () => S.tv.on,
  stats: () => S.stats.length > 0, tk: () => !!S.tk.ch, logs: () => LOG_KEYS.some(lgOn), auto: () => ['spam', 'words', 'link', 'mention'].some((k) => S.sec[k]),
  raid: () => ['nuke', 'raid', 'bots', 'esc'].some((k) => S.sec[k]),
};
function drawNav() {
  $('#nav').innerHTML = NAV.map(([g, items]) => `<div class="gt">${g}</div>` + items.map(([k, ic, n]) => `<button class="nv ${k === cur ? 'on' : ''}" data-go="${k}"><i>${ic}</i><span>${n}</span>${ENABLED[k]?.() ? '<em>✓</em>' : ''}</button>`).join('')).join('');
}
function drawTop() {
  const label = NAV.flatMap((g) => g[1]).find((x) => x[0] === cur);
  $('#title').textContent = label ? label[2] : '';
  $('#pdesc').textContent = PD[cur] || '';
  $('#master').innerHTML = `<small>${S.on !== false ? '🟢 البوت يعمل' : '🔴 البوت متوقف'}</small>${sw('on', true)}`;
  const sb = ST.sub;
  $('#banner').innerHTML = sb && (!sb.active || (sb.days !== null && sb.days <= 7))
    ? `<div class="ban" style="background:${sb.active ? '#2a2208' : '#2a0a12'};border:1px solid ${sb.active ? '#f1c40f' : '#ff4d6d'}">${sb.active ? `⏰ اشتراك البوت ينتهي بعد ${sb.days} يوم.` : '⛔ اشتراك البوت متوقف أو منتهي في هذا السيرفر، والبوت لا يعمل حالياً.'} ${esc(sb.msg || '')} ${sb.contact ? '— ' + esc(sb.contact) : ''}</div>` : '';
}
async function go(p) {
  cur = p; location.hash = '#/' + p;
  drawTop(); drawNav();
  const v = $('#view');
  v.innerHTML = '<p class="mu">جاري التحميل…</p>';
  if (P[p].load) await P[p].load();
  v.innerHTML = P[p].render();
  P[p].after?.();
  window.scrollTo(0, 0);
}

/* ============ logs catalog ============ */
const LOGS = [
  ['👤', 'الأعضاء', [['join', '📥', 'دخول عضو'], ['leave', '📤', 'خروج عضو'], ['nick', '🏷️', 'تغيير لقب'], ['mrole', '🎭', 'تغيير رتب عضو'], ['timeout', '🔇', 'كتم مؤقت'], ['ban', '🔨', 'حظر'], ['unban', '♻️', 'فك حظر']]],
  ['💬', 'الرسائل', [['msgdel', '🗑️', 'حذف رسالة'], ['msgedit', '✏️', 'تعديل رسالة']]],
  ['📁', 'الرومات', [['chcreate', '📁', 'إنشاء روم'], ['chdelete', '🗑️', 'حذف روم'], ['chupdate', '🛠️', 'تعديل روم (اسم، وصف، صلاحيات...)']]],
  ['🎭', 'الرتب', [['rolecreate', '🎭', 'إنشاء رتبة'], ['roledelete', '🗑️', 'حذف رتبة'], ['roleupdate', '🛠️', 'تعديل رتبة (اسم، لون، صلاحيات...)']]],
  ['🔊', 'الصوت', [['vjoin', '🔊', 'دخول روم صوتي'], ['vleave', '🔇', 'خروج من روم صوتي'], ['vmove', '🔀', 'انتقال بين الرومات']]],
  ['⚙️', 'السيرفر', [['gupdate', '⚙️', 'تعديل إعدادات السيرفر'], ['emojiadd', '😀', 'إضافة إيموجي'], ['emojidel', '🗑️', 'حذف إيموجي'], ['invcreate', '🔗', 'إنشاء دعوة'], ['invdelete', '🔗', 'حذف دعوة']]],
  ['🧩', 'الأنظمة', [['protect', '🛡️', 'الحماية التلقائية (تنبيهات الحماية)'], ['tkopen', '🎫', 'فتح تذكرة'], ['tkclose', '🔒', 'إغلاق تذكرة']]],
];
const LOG_KEYS = LOGS.flatMap((c) => c[2].map((e) => e[0]));
const lgOn = (k) => (k === 'protect' ? S.lg?.[k]?.on !== false : S.lg?.[k]?.on === true);

/* ============ pages ============ */
const P = {
  home: {
    render() {
      const sub = ST.sub, protOn = Object.values(S.sec).filter(Boolean).length;

  stNew: async () => { const tpl = $('#stT').value.trim() || '👥 الأعضاء: {members}'; const r = await api('/api/stats/create', { tpl }); if (r && r.ok) { S.stats.push({ ch: r.id, tpl }); await save(); await refresh(); go('stats'); } else ok(r); },
  stUp: async () => { await save(); const r = await api('/api/stats/update', {}); toast(r && r.ok ? `✅ حُدّث ${r.n} روم` : 'فشل'); },
  prApply: async () => ok(await api('/api/presence', { status: $('#prS').value, type: $('#prT').value, text: $('#prX').value })),
  exp: () => { const { panic, wl, ...c } = S; $('#io').value = JSON.stringify(c, null, 1); },
  imp: () => { try { merge(S, JSON.parse($('#io').value)); save('✅ تم الاستيراد'); go('bot'); } catch { toast('JSON غير صحيح'); } },
  rst: async () => { if (confirm('إعادة ضبط كل الإعدادات؟')) { await api('/api/reset', {}); location.reload(); } },
  lgEdit: (el) => openLg(el.dataset.k),
  lgSave: (el) => { const k = el.dataset.k; (S.lg[k] ??= {}); Object.assign(S.lg[k], { t: $('#lgT').value, d: $('#lgD').value, c: $('#lgC').value }); closeM(); autosave(); },
  lgReset: (el) => { const e = S.lg[el.dataset.k]; if (e) { delete e.t; delete e.d; delete e.c; } closeM(); autosave(); },
  lgClose: closeM,
};

/* ============ event delegation ============ */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-md],[data-ch]');
  if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.act) return A[t.dataset.act]?.(t);
  if (t.dataset.md) { // member actions (mod page or action buttons)
    const id = t.dataset.uid || $('#mdId')?.value.trim();
    if (!/^\d{15,22}$/.test(id || '')) return toast('ID غير صحيح');
    if (!confirm('تأكيد؟')) return;
    ok(await api('/api/mod', { action: t.dataset.md, id, reason: $('#mdR')?.value || '', min: +($('#mdM')?.value || 60), role: $('#mdRole')?.value, nick: $('#mdN')?.value || '' }));
  }
  if (t.dataset.ch) ok(await api('/api/chan', { action: t.dataset.ch, channel: $('#chSel').value, value: $('#chV').value, title: $('#chTi').value, text: $('#chT').value }));
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.p) { set(S, t.dataset.p, t.checked); save(); drawTop(); drawNav(); if (cur === 'home') go('home'); return; }
  if (t.dataset.n) { set(S, t.dataset.n, +t.value); return autosave(); }
  if (t.dataset.v) { set(S, t.dataset.v, t.value); wPv(); drawNav(); return autosave(); }
  if (t.dataset.ign) { const a = S.lvl.ignore, i = a.indexOf(t.dataset.ign); t.checked ? i < 0 && a.push(t.dataset.ign) : i >= 0 && a.splice(i, 1); return autosave(); }
  if (t.dataset.lg) { (S.lg[t.dataset.lg] ??= {}).on = t.checked; autosave(); drawNav(); return go('logs'); }
  if (t.dataset.lgch) { (S.lg[t.dataset.lgch] ??= {}).ch = t.value; return autosave(); }
  if (t.dataset.lgcat) { const c = LOGS.find((x) => x[1] === t.dataset.lgcat); c[2].forEach(([k]) => ((S.lg[k] ??= {}).on = t.checked)); autosave(); drawNav(); return go('logs'); }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.v && t.tagName !== 'SELECT') { set(S, t.dataset.v, t.value); wPv(); autosave(); }
  if (t.dataset.pv !== undefined) emPv();
});

/* ============ boot ============ */
(async () => {
  const st = await api('/api/state');
  if (!st || st.error) { location.href = '/servers'; return; }
  ST = st; S = merge(JSON.parse(JSON.stringify(DEF)), { ...st.ui, wl: st.wl, panic: st.panic });
  $('#gname').textContent = st.guild;
  if (st.isOwner) $('#ownLink').style.display = 'block';
  const start = (location.hash.match(/#\/(\w+)/) || [])[1];
  go(P[start] ? start : 'home');
})();
</script>
</body>
</html>
